backend:
  name: git-gateway
  branch: main

media_folder: "images/blog"
public_folder: "/images/blog"

collections:
  - name: "blog"
    label: "Bitácora"
    folder: "blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Título", name: "title", widget: "string"}
      - {label: "Fecha de Publicación", name: "date", widget: "datetime", format: "YYYY-MM-DD"}
      - {label: "Categoría", name: "category", widget: "select", options: ["Astrología Védica", "Ritmos Lunares", "Análisis & Coyuntura", "Medicina Holística"]}
      - {label: "Imagen de Portada", name: "image", widget: "image", required: false}
      - {label: "Tiempo de Lectura (min)", name: "readTime", widget: "number", default: 5}
      - {label: "Resumen (para la tarjeta)", name: "description", widget: "text"}
      - {label: "Cuerpo del Artículo", name: "body", widget: "markdown"}
