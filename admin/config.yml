backend:
  name: git-gateway
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "articulos"
    label: "Artículos & Bitácora"
    folder: "_posts/articulos"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Título del Artículo", name: "title", widget: "string" }
      - { label: "Fecha de Publicación", name: "date", widget: "datetime", format: "YYYY-MM-DD", dateFormat: "YYYY-MM-DD", timeFormat: false }
      - { label: "Categoría", name: "category", widget: "select", options: ["Astrología Védica", "Análisis & Coyuntura", "Radio Mega 91.9", "Ritmos Lunares"] }
      - { label: "Tiempo de Lectura", name: "readTime", widget: "string", default: "5 min de lectura" }
      - { label: "Imagen Destacada", name: "image", widget: "image", required: false }
      - { label: "Resumen Corto", name: "summary", widget: "text" }
      - { label: "Contenido Completo", name: "body", widget: "markdown" }
