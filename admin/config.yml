backend:
  name: github
  repo: jyotishayni/web-jyotish-ayni
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "articulos"
    label: "Artículos & Bitácora"
    folder: "_posts/articulos"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Título del Artículo", name: "title", widget: "string" }
      - { label: "Fecha", name: "date", widget: "string", default: "22 Ago 2026" }
      - { label: "Categoría", name: "category", widget: "select", options: ["Ritmos Lunares", "Astrología Védica", "Análisis & Coyuntura", "Radio Mega 91.9"] }
      - { label: "Tiempo de Lectura", name: "readTime", widget: "string", default: "4 min de lectura" }
      - { label: "Imagen de Portada", name: "image", widget: "image", required: false }
      - { label: "Link de Video de YouTube (Opcional)", name: "video", widget: "string", required: false, hint: "Pegá el link completo de YouTube, por ejemplo: https://youtu.be/AfiZPG2seqs" }
      - { label: "Resumen Breve (Para la tarjeta de inicio)", name: "summary", widget: "text" }
      - { label: "Texto Completo del Artículo", name: "body", widget: "markdown" }
      
